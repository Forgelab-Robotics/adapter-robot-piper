# TaskRobot 配置（real_playback 示例）
# 须与录制该 MCAP 时使用的 task_robot 配置一致（joint 名与顺序），否则回放会报 schema 不匹配。

joints:
  - name: joint1
    mode: position
    unit: radians
  - name: joint2
    mode: position
    unit: radians
  - name: joint3
    mode: position
    unit: radians
  - name: joint4
    mode: position
    unit: radians
  - name: joint5
    mode: position
    unit: radians
  - name: joint6
    mode: position
    unit: radians
  - name: gripper
    mode: prismatic
    unit: meters

robots:
  - id: robot_0
    joints: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6", "gripper"]

image_forward:
  image/hand: image/hand
  image/top: image/top
  image/angle: image/angle
  image/left_pillar: image/left_pillar
