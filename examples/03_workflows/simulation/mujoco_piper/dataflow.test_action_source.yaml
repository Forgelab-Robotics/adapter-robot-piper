#! test_action_source 驱动 task_robot + mujoco（Piper）
#! 前置：工作区根下并列存在 forge_runtime 与本仓 robots/piper
#! 运行: dora build dataflow.test_action_source.yaml --uv && dora run dataflow.test_action_source.yaml --uv

nodes:
  - id: mujoco
    path: ../../../../../../forge_runtime/packages/nodes/simulators/mujoco/main.py
    inputs:
      tick: dora/timer/millis/20
      action: task_robot/action
    outputs:
      - proprio_state
      - image/hand
      - image/top
      - image/angle
      - image/left_pillar
    args: --config simulator.yaml

  - id: task_robot
    path: ../../../../../../forge_runtime/packages/nodes/task_robot/main.py
    inputs:
      tick: dora/timer/millis/20
      action: test_action_source/action
      proprio_state: mujoco/proprio_state
      image/hand: mujoco/image/hand
      image/top: mujoco/image/top
      image/angle: mujoco/image/angle
      image/left_pillar: mujoco/image/left_pillar
    outputs:
      - action
      - proprio_state
      - image/hand
      - image/top
      - image/angle
      - image/left_pillar
    args: --config task_robot.yaml

  - id: test_action_source
    path: ../../../../../../forge_runtime/packages/nodes/test_action_source/main.py
    inputs:
      tick: dora/timer/millis/200
      proprio_state: task_robot/proprio_state
    outputs:
      - action
    args: >-
      --joint-order joint1 joint2 joint3 joint4 joint5 joint6 gripper
      --mode sweep
      --output-kind action

  - id: image_viewer
    path: ../../../../../../forge_runtime/packages/nodes/viewers/image_viewer/main.py
    inputs:
      image/hand: task_robot/image/hand
      image/top: task_robot/image/top
      image/angle: task_robot/image/angle
      image/left_pillar: task_robot/image/left_pillar

  - id: stream_viewer
    path: ../../../../../../forge_runtime/packages/nodes/viewers/stream_viewer/main.py
    inputs:
      tick: dora/timer/millis/40
      proprio_state: task_robot/proprio_state
      action: task_robot/action
      image/hand: task_robot/image/hand
      image/top: task_robot/image/top
      image/angle: task_robot/image/angle
      image/left_pillar: task_robot/image/left_pillar
    args: --config stream_viewer.yaml
