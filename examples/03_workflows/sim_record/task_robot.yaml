# TaskRobot 配置示例
# 复制为 config.yaml 并根据实际环境修改
# joints 与 policy.yaml / simulator.yaml 一致

joints:
  - name: joint1
    mode: position
    unit: radians
  - name: joint2
    mode: position
    unit: radians
  - name: joint3
    mode: position
    unit: radians
  - name: joint4
    mode: position
    unit: radians
  - name: joint5
    mode: position
    unit: radians
  - name: joint6
    mode: position
    unit: radians
  - name: gripper
    mode: prismatic
    unit: millimeters

robots:
  - id: robot_0
    joints: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6", "gripper"]

# image 转发：input_id -> output_id，默认相同时可写 "image/main": "image/main"
image_forward:
  image/hand: image/hand
  image/top: image/top
  image/angle: image/angle
  image/left_pillar: image/left_pillar