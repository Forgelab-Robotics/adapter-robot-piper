[project]
name = "agilex-piper"
version = "1.1.3"
description = "Agilex Piper Robot configuration and teleop workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"dora-rs>=0.4.1",
	"typer>=0.25.1",
	"forge-common>=1.0.0,<2",
	"forge-msgs>=1.0.0,<2",
	"forge-robot>=1.0.0,<2",
	"piper-sdk==0.6.2",
	"pyyaml>=6.0",
	"python-can>=4.0",
]

[project.scripts]
robots-agilex-piper = "robots_agilex_piper.main:main"
robots_agilex_piper = "robots_agilex_piper.main:main"

[tool.uv.sources]
forge-common = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", tag = "forge-common-v1.0.0", subdirectory = "packages/common" }
forge-msgs = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", tag = "forge-msgs-v1.0.0", subdirectory = "packages/msgs" }
forge-robot = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", tag = "forge-robot-v1.0.0", subdirectory = "packages/robot" }

[project.optional-dependencies]
pyinstaller = ["pyinstaller>=6.0"]
test = ["mujoco>=3.3.0", "pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "robots_agilex_piper"
